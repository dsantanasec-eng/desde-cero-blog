<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Desde Cero{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Fuente -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg: #f5f8ff;
      --panel: rgba(255,255,255,.78);
      --panel-strong: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --border: rgba(15,23,42,.10);
      --shadow: 0 18px 55px rgba(15, 23, 42, .10);

      --blue: #1d4ed8;
      --blue2:#2563eb;
      --blueSoft:#eaf2ff;
      --chip:#eef2ff;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family:"Poppins", sans-serif;
      background:
        radial-gradient(1200px 600px at 10% 0%, rgba(37,99,235,.18), transparent 60%),
        radial-gradient(900px 500px at 90% 10%, rgba(29,78,216,.12), transparent 55%),
        var(--bg);
      color:var(--text);
    }

    /* NAV */
    .navbar{
      position:sticky; top:0; z-index:50;
      background: rgba(255,255,255,.75);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner{
      max-width:1100px;
      margin:0 auto;
      padding: 14px 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      text-decoration:none !important;
      color:inherit;
    }
    .brand:hover{ text-decoration:none !important; }
    .brand:focus{ outline: none; }
    .brand img{
      width:34px;height:34px;object-fit:contain;
      filter: drop-shadow(0 6px 14px rgba(29,78,216,.18));
    }
    .brand-title{
      font-weight:700;
      line-height:1.05;
      letter-spacing: .2px;
    }
    .brand-sub{
      font-size:.78rem;
      color:var(--muted);
      margin-top:2px;
    }

    .nav-links{
      display:flex;
      align-items:center;
      gap:16px;
      flex-wrap:wrap;
    }
    .nav-links a{
      text-decoration:none;
      color:var(--muted);
      font-weight:600;
      font-size:.92rem;
      padding:8px 10px;
      border-radius: 12px;
      transition:.15s ease;
    }
    .nav-links a:hover{
      background: var(--blueSoft);
      color: var(--text);
    }
    .nav-active{
      background: rgba(29,78,216,.12);
      color: var(--blue);
    }

    /* PAGE */
    .page{
      max-width:1100px;
      margin: 0 auto;
      padding: 26px 16px 70px;
    }

    /* Global card */
    .card{
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: var(--shadow);
    }

    /* Buttons */
    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding: 11px 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.8);
      color: var(--text);
      text-decoration:none;
      font-weight:700;
      transition: .15s ease;
      cursor:pointer;
    }
    .btn:hover{ transform: translateY(-1px); }
    .btn-primary{
      background: linear-gradient(135deg, var(--blue), var(--blue2));
      color:white;
      border-color: rgba(29,78,216,.35);
      box-shadow: 0 18px 45px rgba(29,78,216,.20);
    }

    /* Chips */
    .chip{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--chip);
      border: 1px solid rgba(29,78,216,.12);
      color: #1e3a8a;
      font-size: .78rem;
      font-weight: 600;
    }

    footer{
      margin-top: 55px;
      padding: 18px 16px;
      text-align:center;
      color: var(--muted);
      font-size:.85rem;
    }
  </style>

  {% block head_extra %}{% endblock %}
</head>

<body>
  <header class="navbar">
    <div class="nav-inner">
      <a href="{{ url_for('home') }}" class="brand">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo">
        <div>
          <div class="brand-title">Desde Cero</div>
          <div class="brand-sub">Learn tech. Build skills. Get experience.</div>
        </div>
      </a>

      <nav class="nav-links">
        <a href="{{ url_for('home') }}" class="{% if active_page == 'home' %}nav-active{% endif %}">Inicio</a>
        <a href="{{ url_for('blog_list') }}" class="{% if active_page == 'blog' %}nav-active{% endif %}">Blog</a>
        <a href="{{ url_for('about') }}" class="{% if active_page == 'about' %}nav-active{% endif %}">Acerca de</a>
      </nav>
    </div>
  </header>

  <main class="page">
    {% block content %}{% endblock %}
  </main>

  <footer>
    ©️ {{ current_year }} Desde Cero · Hecho por Diomedes Santana · Construido con Flask
  </footer>
</body>
</html>
