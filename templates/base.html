<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>{% block title %}Desde Cero | Blog{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='desdecero.png') }}">

    <!-- Fuente Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-body: #0f172a;
            --bg-card: #111827;
            --bg-card-soft: #020617;
            --primary: #8b5cf6;
            --primary-soft: #a855f7;
            --primary-strong: #6366f1;
            --text-main: #e5e7eb;
            --text-muted: #9ca3af;
            --border-soft: rgba(148, 163, 184, 0.25);
            --danger: #f97373;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Poppins", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(circle at top left, #1f2937 0, #020617 45%, #020617 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            position: sticky;
            top: 0;
            z-index: 50;
            background: linear-gradient(90deg, #020617 0%, #111827 40%, #4c1d95 100%);
            border-bottom: 1px solid rgba(148, 163, 184, 0.35);
            backdrop-filter: blur(14px);
        }

        .navbar-inner {
            max-width: 960px;
            margin: 0 auto;
            padding: 0.75rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            text-decoration: none;
        }

        .brand-logo img {
            height: 32px;
            width: auto;
            display: block;
        }

        .brand-text-main {
            font-weight: 600;
            font-size: 1.05rem;
            letter-spacing: 0.02em;
            color: #f9fafb;
        }

        .brand-text-sub {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.9rem;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            padding: 0.35rem 0.7rem;
            border-radius: 999px;
            transition: all 0.16s ease-out;
        }

        .nav-links a:hover {
            color: #f9fafb;
            background: rgba(148, 163, 184, 0.18);
        }

        .nav-links a.nav-active {
            color: #f9fafb;
            background: linear-gradient(135deg, var(--primary), var(--primary-soft));
            box-shadow: 0 0 18px rgba(129, 140, 248, 0.6);
        }

        .page {
            flex: 1;
            max-width: 960px;
            width: 100%;
            margin: 0 auto;
            padding: 1.75rem 1.25rem 2.5rem;
        }

        @media (max-width: 640px) {
            .navbar-inner { padding-inline: 1rem; }
            .page { padding-inline: 1rem; }
        }

        .footer {
            border-top: 1px solid rgba(31, 41, 55, 0.95);
            background: #020617;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .footer-inner {
            max-width: 960px;
            margin: 0 auto;
            padding: 0.9rem 1.25rem 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>

<header class="navbar">
    <div class="navbar-inner">
        <a href="{{ url_for('home') }}" class="brand">

            <!-- ✅ TU LOGO PNG AQUÍ -->
            <div class="brand-logo">
                <img src="{{ url_for('static', filename='desdecero.png') }}" alt="Logo Desde Cero">
            </div>

            <div>
                <div class="brand-text-main">Desde Cero</div>
                <div class="brand-text-sub">Aprende, aplica y gana experiencia</div>
            </div>
        </a>

        <nav class="nav-links">
            <a href="{{ url_for('home') }}" class="{% if active_page == 'home' %}nav-active{% endif %}">Inicio</a>
            <a href="{{ url_for('blog_list') }}" class="{% if active_page == 'blog' %}nav-active{% endif %}">Blog</a>
            <a href="{{ url_for('about') }}" class="{% if active_page == 'about' %}nav-active{% endif %}">Acerca de</a>
        </nav>
    </div>
</header>

<main class="page">
    {% block content %}{% endblock %}
</main>

<footer class="footer">
    <div class="footer-inner">
        <div>©️ 2025 Desde Cero. Hecho por Diomedes Santana.</div>
        <div>Construido con Flask. Más contenido muy pronto.</div>
    </div>
</footer>

</body>
</html>
