<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>{% block title %}Desde Cero | Blog{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Fuente Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- ✅ IMPORTANTE: Cargar estilos -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header class="navbar">
    <div class="navbar-inner">

        <!-- ✅ LOGO NUEVO -->
        <a href="{{ url_for('home') }}" class="brand">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="brand-logo-img">
            <div>
                <div class="brand-text-main">Desde Cero</div>
                <div class="brand-text-sub">Aprende, aplica y gana experiencia</div>
            </div>
        </a>

        <nav class="nav-links">
            <a href="{{ url_for('home') }}" class="{% if active_page == 'home' %}nav-active{% endif %}">Inicio</a>
            <a href="{{ url_for('blog_list') }}" class="{% if active_page == 'blog' %}nav-active{% endif %}">Blog</a>
            <a href="{{ url_for('about') }}" class="{% if active_page == 'about' %}nav-active{% endif %}">Acerca de</a>
        </nav>

    </div>
</header>

<main class="page">
    {% block content %}{% endblock %}
</main>

<footer class="footer">
    <div class="footer-inner">
        <div>©️ 2025 Desde Cero. Hecho por Diomedes Santana.</div>
        <div>Construido con Flask. Más contenido muy pronto.</div>
    </div>
</footer>

<!-- ✅ Estilos básicos (solo para el logo) -->
<style>
    .brand-logo-img {
        width: 32px;
        height: 32px;
        border-radius: 6px;
        object-fit: cover;
    }
</style>

</body>
</html>
