<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>{% block title %}Desde Cero | Blog{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Fuente Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-body: #0f172a;
            --bg-card: #111827;
            --bg-card-soft: #020617;
            --primary: #8b5cf6;
            --primary-soft: #a855f7;
            --primary-strong: #6366f1;
            --text-main: #e5e7eb;
            --text-muted: #9ca3af;
            --border-soft: rgba(148, 163, 184, 0.25);
            --danger: #f97373;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Poppins", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(circle at top left, #1f2937 0, #020617 45%, #020617 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            position: sticky;
            top: 0;
            z-index: 50;
            background: linear-gradient(90deg, #020617 0%, #111827 40%, #4c1d95 100%);
            border-bottom: 1px solid rgba(148, 163, 184, 0.35);
            backdrop-filter: blur(14px);
        }

        .navbar-inner {
            max-width: 960px;
            margin: 0 auto;
            padding: 0.75rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            text-decoration: none;
        }

        .brand-logo {
            width: 30px;
            height: 30px;
            border-radius: 10px;
            background: conic-gradient(from 180deg, #a855f7, #22d3ee, #f97316, #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.6);
        }

        .brand-logo span { font-size: 0.9rem; font-weight: 700; color: #0b1120; }

        .brand-text-main {
            font-weight: 600;
            font-size: 1.05rem;
            letter-spacing: 0.02em;
            color: #f9fafb;
        }

        .brand-text-sub {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.9rem;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            padding: 0.35rem 0.7rem;
            border-radius: 999px;
            transition: all 0.16s ease-out;
        }

        .nav-links a:hover {
            color: #f9fafb;
            background: rgba(148, 163, 184, 0.18);
        }

        .nav-links a.nav-active {
            color: #f9fafb;
            background: linear-gradient(135deg, var(--primary), var(--primary-soft));
            box-shadow: 0 0 18px rgba(129, 140, 248, 0.6);
        }

        .page {
            flex: 1;
            max-width: 960px;
            width: 100%;
            margin: 0 auto;
            padding: 1.75rem 1.25rem 2.5rem;
        }

        @media (max-width: 640px) {
            .navbar-inner { padding-inline: 1rem; }
            .page { padding-inline: 1rem; }
        }

        .hero {
            background: radial-gradient(circle at top left, rgba(129, 140, 248, 0.2), transparent 55%),
                        radial-gradient(circle at bottom right, rgba(236, 72, 153, 0.18), transparent 55%);
            border-radius: 20px;
            padding: 2.25rem 2rem;
            border: 1px solid rgba(148, 163, 184, 0.45);
            box-shadow: 0 22px 45px rgba(15, 23, 42, 0.9);
            position: relative;
            overflow: hidden;
        }

        .hero-kicker {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.22em;
            color: var(--primary-soft);
            font-weight: 600;
            margin-bottom: 0.9rem;
        }

        .hero-title {
            font-size: clamp(1.9rem, 3vw, 2.4rem);
            font-weight: 700;
            margin: 0 0 0.4rem;
        }

        .hero-subtitle {
            font-size: 0.95rem;
            max-width: 480px;
            color: var(--text-muted);
            margin-bottom: 1.4rem;
        }

        .hero-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.25rem 0.7rem;
            border-radius: 999px;
            border: 1px solid rgba(148, 163, 184, 0.4);
            background: rgba(15, 23, 42, 0.65);
        }

        .pill-dot {
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: #22c55e;
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.7);
        }

        .hero-actions {
            margin-top: 1.8rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.9rem;
        }

        .btn-primary {
            border-radius: 999px;
            border: none;
            background: linear-gradient(135deg, var(--primary-strong), var(--primary-soft));
            color: #f9fafb;
            padding: 0.65rem 1.4rem;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            box-shadow: 0 12px 30px rgba(79, 70, 229, 0.65);
            transition: transform 0.15s ease-out, box-shadow 0.15s ease-out;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 17px 40px rgba(79, 70, 229, 0.9);
        }

        .btn-ghost {
            border-radius: 999px;
            padding: 0.6rem 1.15rem;
            border: 1px solid rgba(148, 163, 184, 0.55);
            background: rgba(15, 23, 42, 0.8);
            color: var(--text-main);
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            transition: all 0.15s ease-out;
        }

        .btn-ghost:hover {
            background: rgba(15, 23, 42, 0.95);
            border-color: var(--primary-soft);
        }

        .section { margin-top: 2.25rem; }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .section-title {
            font-size: 1.05rem;
            font-weight: 600;
        }

        .section-subtitle {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .post-list {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 1rem;
        }

        .post-card {
            border-radius: 16px;
            padding: 1rem 1.1rem;
            background: radial-gradient(circle at top left, rgba(129, 140, 248, 0.15), transparent 50%),
                        var(--bg-card);
            border: 1px solid var(--border-soft);
            text-decoration: none;
            color: inherit;
            display: block;
            transition: transform 0.16s ease-out, box-shadow 0.16s ease-out, border 0.16s ease-out;
        }

        .post-card:hover {
            transform: translateY(-3px);
            border-color: rgba(168, 85, 247, 0.9);
            box-shadow: 0 16px 32px rgba(15, 23, 42, 0.95);
        }

        .post-card-title {
            font-size: 1rem;
            font-weight: 600;
            margin: 0 0 0.25rem;
        }

        .post-card-meta {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .post-card-excerpt {
            font-size: 0.85rem;
            color: #e5e7eb;
            margin-bottom: 0.6rem;
        }

        .post-card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.35rem;
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .link-muted {
            color: var(--text-muted);
            font-size: 0.78rem;
            text-decoration: underline;
            text-decoration-style: dotted;
        }

        .article-header { margin-bottom: 1.1rem; }
        .article-title { font-size: 1.5rem; font-weight: 700; margin: 0 0 0.25rem; }
        .article-meta { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.8rem; }

        .article-body {
            padding: 1rem 1.1rem;
            border-radius: 18px;
            background: var(--bg-card);
            border: 1px solid var(--border-soft);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .article-body p { margin-top: 0; margin-bottom: 0.7rem; }

        .comments { margin-top: 2rem; }

        .comment {
            border-radius: 12px;
            padding: 0.75rem 0.9rem;
            background: #020617;
            border: 1px solid rgba(31, 41, 55, 0.9);
            margin-bottom: 0.6rem;
        }

        .comment-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-bottom: 0.35rem;
        }

        .comment-author { font-weight: 500; color: #e5e7eb; }
        .comment-content { font-size: 0.9rem; }

        .comment-form {
            margin-top: 1.4rem;
            border-radius: 16px;
            padding: 1rem 1.1rem;
            background: var(--bg-card-soft);
            border: 1px dashed rgba(148, 163, 184, 0.6);
        }

        .form-field label {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: block;
            margin-bottom: 0.25rem;
        }

        .form-input,
        .form-textarea {
            width: 100%;
            border-radius: 10px;
            border: 1px solid rgba(55, 65, 81, 0.9);
            padding: 0.5rem 0.65rem;
            background: rgba(15, 23, 42, 0.95);
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.9rem;
        }

        .form-textarea { min-height: 90px; resize: vertical; }

        .form-input:focus,
        .form-textarea:focus {
            outline: none;
            border-color: var(--primary-soft);
            box-shadow: 0 0 0 1px rgba(129, 140, 248, 0.7);
        }

        .form-footer {
            margin-top: 0.8rem;
            display: flex;
            justify-content: flex-end;
        }

        .footer {
            border-top: 1px solid rgba(31, 41, 55, 0.95);
            background: #020617;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .footer-inner {
            max-width: 960px;
            margin: 0 auto;
            padding: 0.9rem 1.25rem 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>

<header class="navbar">
    <div class="navbar-inner">
        <a href="{{ url_for('home') }}" class="brand">
            <div class="brand-logo">
                <span>0</span>
            </div>
            <div>
                <div class="brand-text-main">Desde Cero</div>
                <div class="brand-text-sub">Aprende, aplica y gana experiencia</div>
            </div>
        </a>

        <nav class="nav-links">
            <a href="{{ url_for('home') }}" class="{% if active_page == 'home' %}nav-active{% endif %}">Inicio</a>
            <a href="{{ url_for('blog_list') }}" class="{% if active_page == 'blog' %}nav-active{% endif %}">Blog</a>
            <a href="{{ url_for('about') }}" class="{% if active_page == 'about' %}nav-active{% endif %}">Acerca de</a>
        </nav>
    </div>
</header>

<main class="page">
    {% block content %}{% endblock %}
</main>

<footer class="footer">
    <div class="footer-inner">
        <div>© 2025 Desde Cero. Hecho por Diomedes Santana.</div>
        <div>Construido con Flask. Más contenido muy pronto.</div>
    </div>
</footer>

</body>
</html>
