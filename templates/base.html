<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>{% block title %}Desde Cero | Blog{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #f8fafc;
            --bg-nav: #ffffff;
            --primary: #2563eb;
            --primary-soft: #e0e7ff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-soft: #e5e7eb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Poppins", sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
        }

        /* NAVBAR */
        .navbar {
            background: var(--bg-nav);
            border-bottom: 1px solid var(--border-soft);
            padding: 14px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .brand img {
            width: 34px;
            height: 34px;
            object-fit: contain;
        }

        .brand-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .brand-sub {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* LINKS */
        .nav-links a {
            text-decoration: none;
            color: var(--text-muted);
            margin-left: 18px;
            font-size: 0.9rem;
            padding: 6px 12px;
            border-radius: 8px;
            transition: all 0.15s ease;
        }

        .nav-links a:hover {
            background: var(--primary-soft);
            color: var(--primary);
        }

        .nav-active {
            background: var(--primary);
            color: #ffffff !important;
            font-weight: 600;
        }

        /* PAGE */
        .page {
            max-width: 920px;
            margin: 2.5rem auto;
            padding: 0 1rem;
        }

        /* FOOTER */
        footer {
            margin-top: 4rem;
            padding: 2rem 1rem;
            background: #ffffff;
            border-top: 1px solid var(--border-soft);
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>

<body>

<header class="navbar">
    <a href="{{ url_for('home') }}" class="brand">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Desde Cero Logo">
        <div>
            <div class="brand-title">Desde Cero</div>
            <div class="brand-sub">Learn skills. Build experience. Grow.</div>
        </div>
    </a>

    <nav class="nav-links">
        <a href="{{ url_for('home') }}" class="{% if active_page == 'home' %}nav-active{% endif %}">Inicio</a>
        <a href="{{ url_for('blog_list') }}" class="{% if active_page == 'blog' %}nav-active{% endif %}">Blog</a>
        <a href="{{ url_for('about') }}" class="{% if active_page == 'about' %}nav-active{% endif %}">Acerca de</a>
    </nav>
</header>

<main class="page">
    {% block content %}{% endblock %}
</main>

<footer>
    © 2025 Desde Cero · Built with Flask · By Diomedes Santana
</footer>

</body>
</html>
